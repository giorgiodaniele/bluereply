services:
  jenkins:
    image:          jenkins/jenkins:lts
    container_name: jenkins
    restart:        unless-stopped
    ports:
      - "9090:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
    networks:
      - toolchain_net

  gitea:
    image:          gitea/gitea:latest
    container_name: gitea
    restart:        unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: sqlite3
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea_data:/data
    networks:
      - toolchain_net

